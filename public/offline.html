<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline · Roundtable Finance</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fafafa;
        color: #0a0a0a;
        padding: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #fafafa;
        }
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        opacity: 0.7;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border: none;
        border-radius: 0.625rem;
        padding: 0.6rem 1.1rem;
        background: currentColor;
      }
      button span {
        color: #fafafa;
        mix-blend-mode: difference;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You&rsquo;re offline</h1>
      <p>
        Roundtable Finance can&rsquo;t reach the network right now. Your data is
        safe — reconnect to pick up where you left off.
      </p>
      <button onclick="location.reload()"><span>Try again</span></button>
    </main>
  </body>
</html>
